name: CI and deploy to Hetzner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://example.invalid/api/v1' }}
          BACKEND_INTERNAL_URL: ${{ vars.BACKEND_INTERNAL_URL }}

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy exact commit over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.HETZNER_SSH_PORT || '22' }}
          APP_DIR: ${{ vars.DEPLOY_PATH }}
          PM2_APP: ${{ vars.PM2_APP_NAME }}
          HEALTH_URL: ${{ vars.HEALTHCHECK_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_DIR PM2_APP HEALTH_URL; do
            if [[ -z ${!name} ]]; then
              echo "::error::Missing configuration: $name. See docs/deployment.md."
              exit 1
            fi
          done
          [[ $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo 'Invalid SSH host'; exit 1; }
          [[ $SSH_USER =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Invalid SSH user'; exit 1; }
          [[ $SSH_PORT =~ ^[0-9]+$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo 'Invalid SSH port'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          # %q protects directory/name/URL values from remote shell interpretation.
          printf -v remote_command 'bash -s -- %q %q %q %q %q' \
            "$APP_DIR" "$PM2_APP" "$HEALTH_URL" "$COMMIT" 'backend'
          ssh -T -p "$SSH_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" "$remote_command" < scripts/deploy.sh
